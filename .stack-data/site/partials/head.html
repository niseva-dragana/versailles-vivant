<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="meta_title">{{meta_title}}</title>
<meta name="description" data-i18n-content="meta_desc" content="{{meta_desc}}">
{{#indexable}}<link rel="canonical" href="{{ORIGIN}}/{{page}}">
<link rel="alternate" hreflang="en" href="{{ORIGIN}}/{{page}}">
<link rel="alternate" hreflang="fr" href="{{ORIGIN}}/{{page}}?lang=fr">
<link rel="alternate" hreflang="mk" href="{{ORIGIN}}/{{page}}?lang=mk">
<link rel="alternate" hreflang="x-default" href="{{ORIGIN}}/{{page}}">
<meta property="og:url" content="{{ORIGIN}}/{{page}}">{{/indexable}}{{^indexable}}<meta name="robots" content="noindex">{{/indexable}}

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<meta property="og:title" data-i18n-content="meta_title" content="{{meta_title}}">
<meta property="og:description" data-i18n-content="meta_desc" content="{{meta_desc}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Versailles Vivant">
<meta property="og:locale" data-i18n-content="og_locale" content="en_US">

<meta name="twitter:title" data-i18n-content="meta_title" content="{{meta_title}}">
<meta name="twitter:description" data-i18n-content="meta_desc" content="{{meta_desc}}">
